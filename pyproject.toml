[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "code-mower"
version = "1.0.3"
description = "Multi-reviewer AI code audit orchestration"
requires-python = ">=3.12"
readme = "README.md"
license = "Apache-2.0"
keywords = ["ai", "code-review", "github-actions", "developer-tools"]
classifiers = [
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = ["PyYAML>=6.0"]

[project.urls]
Homepage = "https://github.com/codemower-ai/code-mower"
Documentation = "https://github.com/codemower-ai/code-mower#readme"
Repository = "https://github.com/codemower-ai/code-mower"
Issues = "https://github.com/codemower-ai/code-mower/issues"
Changelog = "https://github.com/codemower-ai/code-mower/blob/main/CHANGELOG.md"

[project.optional-dependencies]
test = [
    "build>=1.2",
    "pytest>=8.0",
    "ruff>=0.8",
    "twine>=5.0",
]

[project.scripts]
code-mower = "code_mower.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
code_mower = [
    "*.json",
    "templates/**/*.json",
    "templates/**/*.md",
    "templates/**/*.yml",
    "templates/**/*.yaml",
    "templates/**/*.j2",
    "templates/lanes/*",
    "templates/product-support/*",
]

[tool.setuptools.exclude-package-data]
code_mower = [
    "**/__pycache__/*",
    "**/*.pyc",
    "**/*.pyo",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
ignore = [
    "E501",
    # LaneConfig instances are finite config objects; keep the callable helper
    # shape stable instead of churning call sites for cached_property.
    "B019",
]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["E402"]
