devin:
  provider: "devin"
  product: "devin"
  transport: "devin_api_v3"
  capabilities:
    coordinate: "unavailable"
    build: "agent_handoff"
    review: "evidence_only"
    message: "unavailable"
    cancel: "unavailable"
    context: "unavailable"
    structured_results: "campaign_only"
  driver: "hosted_bridge"
  type: "audit"
  adapter: null
  trailer_lane: null
  spend_policy: "paid"
  merge_authority: false
  informational: true
  enabled_by_default: false
  events: []
  token_env:
    - "DEVIN_AUDIT_LABEL_TOKEN"
    - "GITHUB_TOKEN"
  token_env_any: []
  trigger_policy: "manual"
  provider_config:
    campaign_transport: "devin_api_v3"
    campaign_required_env_all:
      - "DEVIN_API_KEY"
      - "DEVIN_ORG_ID"
    campaign_repository_scope_env: "CODE_MOWER_DEVIN_REPOSITORIES"
    campaign_response_timeout_seconds: 3600
    status: "informational hosted Devin v3 Sessions API transport; not merge authority until independently calibrated; issue marker is optional audit evidence"
  review_hygiene:
    workflow: ".github/workflows/devin-clear-stale.yml"
    token_env: "GITHUB_TOKEN"
