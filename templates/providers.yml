version: 1
provider_templates:
  acp_bridge:
    provider: "acp"
    driver: "local_cli"
    type: "audit"
    adapter: null
    trailer_lane: null
    spend_policy: "none"
    merge_authority: false
    informational: true
    enabled_by_default: false
    events: []
    token_env:
      - "GITHUB_TOKEN"
    token_env_any: []
    trigger_policy: "manual"
    provider_config:
      command_env: "CODE_MOWER_ACP_COMMAND"
      model_env: "CODE_MOWER_ACP_MODEL"
      protocol: "agent-client-protocol"
      prompt_lenses:
        - "base-audit"
      status: "protocol research lane; no automatic merge authority"
    review_hygiene: {}
  aider:
    provider: "aider"
    driver: "local_cli"
    type: "audit"
    adapter: null
    trailer_lane: null
    spend_policy: "local"
    merge_authority: false
    informational: true
    enabled_by_default: false
    events: []
    token_env:
      - "AIDER_AUDIT_LABEL_TOKEN"
      - "GITHUB_TOKEN"
    token_env_any: []
    trigger_policy: "manual"
    provider_config:
      command: "aider"
      mode: "review-only"
      model_env: "AIDER_MODEL"
      model_env_any:
        - "CODE_MOWER_AIDER_MODEL"
        - "AIDER_CHAT_MODEL"
      api_base_env: "AIDER_API_BASE"
      status: "optional tool lane; provider-specific invocation belongs in an adapter"
    review_hygiene: {}
  antigravity_cli:
    provider: "antigravity"
    driver: "local_cli"
    type: "audit"
    adapter: null
    trailer_lane: null
    spend_policy: "included"
    merge_authority: false
    informational: true
    enabled_by_default: false
    events: []
    token_env:
      - "GITHUB_TOKEN"
    token_env_any: []
    trigger_policy: "manual"
    provider_config:
      command: "agy"
      alternate_commands:
        - "antigravity"
      command_env: "ANTIGRAVITY_CLI_COMMAND"
      model_env: "ANTIGRAVITY_MODEL"
      model_env_any:
        - "CODE_MOWER_ANTIGRAVITY_MODEL"
      prompt_lenses:
        - "base-audit"
      required_env_truthy:
        - "ANTIGRAVITY_CLI_USE_AMBIENT_HOME"
      doctor_probe_args:
        - "--version"
      auth: "run `agy` login/install locally; set ANTIGRAVITY_CLI_USE_AMBIENT_HOME=1 to opt into local OAuth state in trusted environments"
      status: "forward Google CLI research lane; not merge authority until calibrated"
    review_hygiene: {}
  claude_audit:
    provider: "claude"
    driver: "local_cli"
    type: "audit"
    adapter: null
    trailer_lane: "claude"
    spend_policy: "included"
    merge_authority: true
    informational: false
    enabled_by_default: true
    events: []
    token_env:
      - "DISPATCH_TOKEN"
      - "GITHUB_TOKEN"
    token_env_any: []
    trigger_policy: "label"
    provider_config:
      command: "claude"
      model_env: "CLAUDE_AUDIT_MODEL"
      default_model: "sonnet"
      doctor_probe_args:
        - "--print"
        - "--output-format"
        - "json"
        - "--no-session-persistence"
        - "--setting-sources"
        - "local"
        - "--strict-mcp-config"
        - "--mcp-config"
        - '{"mcpServers":{}}'
        - "--disable-slash-commands"
        - "--tools"
        - ""
        - "--model"
        - "sonnet"
        - "--max-budget-usd"
        - "0.25"
        - "Reply with exactly: ok"
      doctor_probe_timeout_seconds: 30
      doctor_probe_expect_json: true
      doctor_probe_expect_json_field: "result"
      doctor_probe_expect_json_value: "ok"
      doctor_probe_error_fields:
        - "is_error"
        - "api_error_status"
      doctor_probe_auth_status_fields:
        - "api_error_status"
    review_hygiene:
      workflow: ".github/workflows/claude-clear-stale.yml"
      token_env: "GITHUB_TOKEN"
  claude_review:
    provider: "claude"
    driver: "manual"
    type: "review"
    adapter: null
    trailer_lane: null
    spend_policy: "none"
    merge_authority: false
    informational: true
    enabled_by_default: true
    events: []
    token_env:
      - "CLAUDE_REVIEW_LABEL_TOKEN"
    token_env_any: []
    trigger_policy: "manual"
    provider_config: {}
    review_hygiene: {}
  coderabbit_cli:
    provider: "coderabbit"
    driver: "local_cli"
    type: "audit"
    adapter: null
    trailer_lane: null
    spend_policy: "included"
    merge_authority: false
    informational: true
    enabled_by_default: false
    events: []
    token_env:
      - "GITHUB_TOKEN"
    token_env_any: []
    trigger_policy: "manual"
    provider_config:
      command: "coderabbit"
      alternate_commands:
        - "cr"
      model_env_any:
        - "CODE_MOWER_CODERABBIT_MODEL"
        - "CODERABBIT_MODEL"
      status: "optional CLI lane for local/on-demand review capture"
    review_hygiene: {}
  codex:
    provider: "codex"
    driver: "local_cli"
    type: "audit"
    adapter: null
    trailer_lane: null
    spend_policy: "included"
    merge_authority: true
    informational: false
    enabled_by_default: true
    events: []
    token_env:
      - "DISPATCH_TOKEN"
      - "GITHUB_TOKEN"
    token_env_any: []
    trigger_policy: "label"
    provider_config:
      command: "codex"
      model_env_any:
        - "CODE_MOWER_CODEX_MODEL"
        - "CODEX_MODEL"
        - "OPENAI_MODEL"
      doctor_probe_args:
        - "--version"
    review_hygiene:
      workflow: ".github/workflows/codex-clear-stale.yml"
      token_env: "GITHUB_TOKEN"
  cursor_cloud_agent:
    provider: "cursor_cloud_agent"
    driver: "hosted_bridge"
    type: "audit"
    adapter: null
    trailer_lane: null
    spend_policy: "paid"
    merge_authority: true
    informational: false
    enabled_by_default: false
    events: []
    token_env:
      - "CURSOR_CLOUD_AGENT_AUDIT_LABEL_TOKEN"
      - "GITHUB_TOKEN"
    token_env_any: []
    trigger_policy: "manual"
    provider_config:
      bot_authors:
        - "cursor[bot]"
        - "cursor"
      bot_authors_env: "CURSOR_CLOUD_AGENT_BOT_AUTHORS"
      trigger_comments:
        - "@cursor"
      campaign_transport_ready_env: "CODE_MOWER_CURSOR_CLOUD_AGENT_CAMPAIGN_TRANSPORT_READY"
      campaign_response_timeout_seconds: 3600
      rules_file: ".cursor/AGENT.md"
      role: "builder"
      capability: "work_order_execution"
      status: "hosted async builder with release qualification capability"
  cursor_bugbot:
    provider: "cursor_bugbot"
    driver: "saas_event"
    type: "audit"
    adapter: "cursor_bugbot"
    trailer_lane: null
    spend_policy: "paid"
    merge_authority: false
    informational: true
    enabled_by_default: false
    events:
      - "issue_comment"
    token_env:
      - "CURSOR_BUGBOT_AUDIT_LABEL_TOKEN"
      - "GITHUB_TOKEN"
    token_env_any: []
    trigger_policy: "manual"
    provider_config:
      bot_authors:
        - "cursor[bot]"
        - "cursor"
      bot_authors_env: "CURSOR_BUGBOT_BOT_AUTHORS"
      trigger_comments:
        - "bugbot run"
        - "@cursor review"
      rules_file: ".cursor/BUGBOT.md"
      role: "reviewer"
      capability: "code_review"
      status: "manual informational review lane; Grok Bot and BugBot are review surfaces only"
    review_hygiene: {}
  devin:
    provider: "devin"
    driver: "hosted_bridge"
    type: "audit"
    adapter: null
    trailer_lane: null
    spend_policy: "paid"
    merge_authority: true
    informational: false
    enabled_by_default: false
    events: []
    token_env:
      - "DEVIN_AUDIT_LABEL_TOKEN"
      - "GITHUB_TOKEN"
    token_env_any: []
    trigger_policy: "manual"
    provider_config: {}
    review_hygiene:
      workflow: ".github/workflows/devin-clear-stale.yml"
      token_env: "GITHUB_TOKEN"
  devin_cli:
    provider: "devin_cli"
    driver: "local_cli"
    type: "audit"
    adapter: null
    trailer_lane: null
    spend_policy: "included"
    merge_authority: false
    informational: true
    enabled_by_default: false
    events: []
    token_env:
      - "GITHUB_TOKEN"
    token_env_any: []
    trigger_policy: "manual"
    provider_config:
      command: "devin"
      command_env: "CODE_MOWER_DEVIN_CLI_COMMAND"
      model_env: "CODE_MOWER_DEVIN_CLI_MODEL"
      model_env_any:
        - "DEVIN_CLI_MODEL"
        - "DEVIN_MODEL"
      prompt_lenses:
        - "base-audit"
      doctor_probe_args:
        - "--version"
      doctor_probe_timeout_seconds: 30
      campaign_auth_probe_args:
        - "auth"
        - "status"
      campaign_auth_probe_timeout_seconds: 20
      campaign_auth_logged_out_exit_codes:
        - 1
      campaign_auth_logged_out_markers:
        - "not authenticated"
        - "not logged in"
      campaign_auth_location_label: "ambient Devin CLI session"
      local_cli_path_basename_only: true
      local_audit_eligible: true
      campaign_eligible: true
      campaign_adapter_argv:
        - "{python}"
        - "-m"
        - "code_mower.campaign_adapters"
        - "--provider"
        - "devin_cli"
        - "--provider-bin"
        - "{command}"
        - "--python-bin"
        - "{target_python}"
        - "--target-runtime"
        - "{target_runtime}"
        - "--release-tag"
        - "{release_tag}"
        - "--package-spec"
        - "{package_spec}"
        - "--qualification-context"
        - "{qualification_context}"
        - "--starting-version"
        - "{starting_version}"
        - "--package-source"
        - "{package_source}"
        - "--timeout-seconds"
        - "{adapter_timeout}"
        - "--output"
        - "{output}"
      campaign_adapter_timeout_seconds: 900
      auth: "run `devin auth login` in a trusted environment; doctor only reports bounded auth status and never persists the output"
      status: "informational local Devin CLI lane; not merge authority until calibrated for blocker catch rate, false positives, cost, and latency"
    review_hygiene: {}
  gemini_cli:
    provider: "gemini"
    driver: "local_cli"
    type: "audit"
    adapter: null
    trailer_lane: null
    spend_policy: "included"
    merge_authority: false
    informational: true
    enabled_by_default: false
    events: []
    token_env:
      - "GITHUB_TOKEN"
    token_env_any:
      - ["GEMINI_API_KEY", "GOOGLE_API_KEY"]
    trigger_policy: "manual"
    provider_config:
      command: "gemini"
      command_env: "GEMINI_CLI_COMMAND"
      model_env: "GEMINI_MODEL"
      model_env_any:
        - "CODE_MOWER_GEMINI_MODEL"
        - "GOOGLE_GENAI_MODEL"
      prompt_lenses:
        - "base-audit"
      doctor_probe_args:
        - "-p"
        - "Reply with exactly: ok"
        - "--output-format"
        - "json"
        - "--skip-trust"
      doctor_probe_timeout_seconds: 45
      doctor_probe_expect_json: true
      doctor_probe_expect_json_field: "response"
      doctor_probe_expect_json_value: "ok"
      status: "optional third-peer CLI lane; not merge authority until calibrated"
    review_hygiene: {}
  gitar:
    provider: "gitar"
    driver: "saas_event"
    type: "audit"
    adapter: "gitar"
    trailer_lane: null
    spend_policy: "included"
    merge_authority: false
    informational: true
    enabled_by_default: true
    events:
      - "issue_comment"
    token_env:
      - "GITAR_AUDIT_LABEL_TOKEN"
      - "GITHUB_TOKEN"
    token_env_any: []
    trigger_policy: "label"
    provider_config:
      bot_authors:
        - "gitar-ai[bot]"
        - "gitar-bot"
        - "gitar-bot[bot]"
    review_hygiene: {}
  greptile:
    provider: "greptile"
    driver: "saas_event"
    type: "audit"
    adapter: "greptile"
    trailer_lane: null
    spend_policy: "paid"
    merge_authority: false
    informational: true
    enabled_by_default: true
    events:
      - "pull_request_review"
      - "check_run"
    token_env:
      - "GREPTILE_AUDIT_LABEL_TOKEN"
      - "GITHUB_TOKEN"
    token_env_any: []
    trigger_policy: "label"
    provider_config:
      bot_authors:
        - "greptile-apps[bot]"
        - "greptile-apps"
      check_runs:
        - app_slug: "greptile-apps"
          name: "Greptile Review"
    review_hygiene: {}
  hermes_cli:
    provider: "hermes"
    driver: "local_cli"
    type: "audit"
    adapter: null
    trailer_lane: null
    spend_policy: "included"
    merge_authority: false
    informational: true
    enabled_by_default: false
    events: []
    token_env:
      - "GITHUB_TOKEN"
    token_env_any: []
    trigger_policy: "manual"
    provider_config:
      command: "hermes"
      command_env: "HERMES_CLI_COMMAND"
      model_env: "HERMES_INFERENCE_MODEL"
      model_env_any:
        - "CODE_MOWER_HERMES_MODEL"
        - "HERMES_MODEL"
      provider_env: "HERMES_PROVIDER"
      prompt_lenses:
        - "base-audit"
      required_env_truthy:
        - "HERMES_CLI_USE_AMBIENT_HOME"
      doctor_probe_args:
        - "--version"
      auth: "run `hermes setup` or provider login locally; set HERMES_CLI_USE_AMBIENT_HOME=1 to opt into local Hermes auth/session state in trusted environments"
      status: "informational Hermes Agent one-shot lane; not merge authority until calibrated"
    review_hygiene: {}
  muse_cli:
    provider: "muse"
    driver: "local_cli"
    type: "audit"
    adapter: null
    trailer_lane: null
    spend_policy: "included"
    merge_authority: false
    informational: true
    enabled_by_default: false
    events: []
    token_env:
      - "GITHUB_TOKEN"
    token_env_any: []
    trigger_policy: "manual"
    provider_config:
      command: "muse"
      command_env: "MUSE_CLI_COMMAND"
      model_env: "CODE_MOWER_MUSE_MODEL"
      model_env_any:
        - "MUSE_MODEL"
        - "META_MUSE_MODEL"
      prompt_transport: "jsonl_prompt_file"
      prompt_lenses:
        - "base-audit"
      required_env_any:
        - "META_API_KEY"
        - "META_API_KEY_FILE"
      required_env_truthy_any:
        - "MUSE_CLI_USE_AMBIENT_HOME"
      doctor_probe_args:
        - "--version"
      auth: "run `muse login`, set META_API_KEY, or point META_API_KEY_FILE at a local key file. Real audit runs that inherit local login state require MUSE_CLI_USE_AMBIENT_HOME=1 in trusted environments"
      status: "experimental Muse Code lane; informational until calibrated for blocker catch rate, false positives, cost, and latency"
    review_hygiene: {}
  grok_build:
    provider: "grok_build"
    driver: "local_cli"
    type: "audit"
    adapter: null
    trailer_lane: null
    spend_policy: "included"
    merge_authority: false
    informational: true
    enabled_by_default: false
    events: []
    token_env:
      - "GITHUB_TOKEN"
    token_env_any: []
    trigger_policy: "manual"
    provider_config:
      command: "grok"
      command_env: "GROK_BUILD_COMMAND"
      model_env: "CODE_MOWER_GROK_MODEL"
      model_env_any:
        - "GROK_MODEL"
        - "XAI_MODEL"
      prompt_transport: "prompt_file"
      prompt_lenses:
        - "base-audit"
      required_env_any:
        - "XAI_API_KEY"
        - "GROK_DEPLOYMENT_KEY"
        - "GROK_API_KEY"
      required_env_truthy_any:
        - "GROK_BUILD_USE_AMBIENT_HOME"
      doctor_probe_args:
        - "-p"
        - "Reply with exactly: ok"
        - "--output-format"
        - "json"
        - "--permission-mode"
        - "plan"
        - "--disable-web-search"
        - "--no-memory"
        - "--max-turns"
        - "1"
      doctor_probe_timeout_seconds: 60
      doctor_probe_expect_json: true
      doctor_probe_expect_json_field: "text"
      doctor_probe_expect_json_value: "ok"
      auth: "run `grok login --device-code` locally, or set XAI_API_KEY. Real audit runs that inherit local OAuth require GROK_BUILD_USE_AMBIENT_HOME=1 in trusted environments"
      status: "informational Grok Build lane; not merge authority until calibrated for blocker catch rate, false positives, cost, and latency"
    review_hygiene: {}
  local_llm:
    provider: "openai_compatible"
    driver: "api_model"
    type: "audit"
    adapter: null
    trailer_lane: null
    spend_policy: "local"
    merge_authority: false
    informational: true
    enabled_by_default: false
    events: []
    token_env:
      - "LOCAL_LLM_AUDIT_LABEL_TOKEN"
      - "LOCAL_LLM_API_KEY"
      - "GITHUB_TOKEN"
    token_env_any: []
    trigger_policy: "manual"
    provider_config:
      api_base_env: "LOCAL_LLM_API_BASE"
      model_env: "LOCAL_LLM_MODEL"
      model_env_any:
        - "CODE_MOWER_LOCAL_LLM_MODEL"
      bot_authors_env: "LOCAL_LLM_BOT_AUTHORS"
      default_api_base: "http://localhost:1234/v1"
      profile_env: "LOCAL_LLM_PROFILE"
      profiles:
        qwen3-coder-next-lmstudio:
          api_base: "http://localhost:1234/v1"
          model: "qwen/qwen3-coder-next"
          context_window: "128000"
          endpoint: "lmstudio"
        gemma4-ollama:
          api_base: "http://localhost:11434/v1"
          model: "gemma4:e4b-mlx"
          context_window: "128000"
          endpoint: "ollama"
      status: "informational calibration lane, not merge authority"
    review_hygiene: {}
  qodo:
    provider: "qodo"
    driver: "saas_event"
    type: "audit"
    adapter: "qodo"
    trailer_lane: null
    spend_policy: "paid"
    merge_authority: false
    informational: true
    enabled_by_default: false
    events:
      - "issue_comment"
    token_env:
      - "QODO_AUDIT_LABEL_TOKEN"
      - "GITHUB_TOKEN"
    token_env_any: []
    trigger_policy: "manual"
    provider_config:
      bot_authors:
        - "qodo-code-review[bot]"
        - "qodo-code-review"
      spend_policy: "never trigger automatically from generated workflows"
    review_hygiene: {}
profiles:
  recommended:
    description: "Fast path for most teams; two local CLI peers plus an always-on advisory SaaS reviewer."
    lanes:
      - "codex"
      - "claude_audit"
      - "gitar"
    source: "repo"
  public_oss:
    description: "Public repository starter; use recommended today, swap Gitar for CodeRabbit once the CodeRabbit adapter lands."
    lanes:
      - "codex"
      - "claude_audit"
      - "gitar"
    source: "repo"
  deep_review:
    description: "Higher-scrutiny private repository profile; Greptile remains opt-in and informational to avoid surprise spend."
    lanes:
      - "codex"
      - "claude_audit"
      - "greptile"
    source: "repo"
  privacy:
    description: "Experimental low-cost/private calibration floor; local LLM is informational only until false-positive rates are measured."
    lanes:
      - "local_llm"
    source: "repo"
  tool_lane:
    description: "Optional local tool-lane proof; Aider stays manual and informational until its review adapter is calibrated."
    lanes:
      - "aider"
    source: "repo"
  third_peer:
    description: "Optional third local CLI reviewer calibration profile; Google, Grok, Hermes, and Muse CLI lanes stay informational until catch rate and false positives are measured."
    lanes:
      - "antigravity_cli"
      - "gemini_cli"
      - "grok_build"
      - "hermes_cli"
      - "muse_cli"
    source: "repo"
  cli_research:
    description: "Optional local CLI and protocol research profile; use for on-demand review capture, not routine merge gates."
    lanes:
      - "antigravity_cli"
      - "gemini_cli"
      - "grok_build"
      - "hermes_cli"
      - "muse_cli"
      - "coderabbit_cli"
      - "acp_bridge"
    source: "repo"
  saas_research:
    description: "Optional manually triggered SaaS reviewer calibration profile; use for capture and value reports, not merge gates."
    lanes:
      - "cursor_bugbot"
      - "qodo"
    source: "repo"
