name: Code Mower Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish_testpypi:
        description: Publish the built distributions to TestPyPI.
        required: false
        default: false
        type: boolean
      publish_pypi:
        description: Publish the built distributions to PyPI.
        required: false
        default: false
        type: boolean
      expected_sha:
        description: Exact 40-character release commit this dispatch must build.
        required: true
        type: string

permissions:
  contents: read

jobs:
  release-identity:
    runs-on: ubuntu-latest
    steps:
      - name: Assert the dispatched ref and commit are the expected release
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          ACTUAL_SHA: ${{ github.sha }}
          ACTUAL_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          printf '%s\n' "$EXPECTED_SHA" | grep -Eq '^[0-9a-f]{40}$'
          [[ "$ACTUAL_REF" == refs/tags/v* ]]
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"

      - name: Check out the event commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Validate the selected tag and immutable public release text
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || github.ref_name }}
          ACTUAL_REF: ${{ github.ref }}
          ACTUAL_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$ACTUAL_REF" = "refs/tags/$RELEASE_TAG"
          test "$(git rev-parse HEAD)" = "$ACTUAL_SHA"
          python src/code_mower/release_identity.py --tag "$RELEASE_TAG"

  build-distributions:
    needs: release-identity
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Build distributions
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
          python -m build

      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: code-mower-dist
          path: dist/*
          if-no-files-found: error

  verify-distributions:
    needs: build-distributions
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: code-mower-dist
          path: dist

      - name: Verify distributions
        run: |
          python -m pip install --upgrade pip
          python -m pip install twine
          python -m twine check dist/*

  publish-testpypi:
    needs: [release-identity, verify-distributions]
    runs-on: ubuntu-latest
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.publish_testpypi == true) || (github.event_name == 'release' && vars.CODE_MOWER_TESTPYPI_PUBLISH == 'true') }}
    permissions:
      contents: read
      id-token: write
    environment: testpypi
    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: code-mower-dist
          path: dist

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    needs: [release-identity, verify-distributions]
    runs-on: ubuntu-latest
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.publish_pypi == true) || (github.event_name == 'release' && vars.CODE_MOWER_PYPI_PUBLISH == 'true') }}
    permissions:
      contents: read
      id-token: write
    environment: pypi
    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: code-mower-dist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
