name: Code Mower Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish_testpypi:
        description: Publish the built distributions to TestPyPI.
        required: false
        default: false
        type: boolean
      publish_pypi:
        description: Publish the built distributions to PyPI.
        required: false
        default: false
        type: boolean
      expected_sha:
        description: Exact 40-character release commit this dispatch must build.
        required: true
        type: string
      candidate_run_id:
        description: Successful immutable-candidate workflow run to publish without rebuilding.
        required: false
        type: string

permissions:
  contents: read

jobs:
  release-identity:
    runs-on: ubuntu-latest
    outputs:
      resolved-sha: ${{ steps.identity.outputs.resolved-sha }}
    steps:
      - name: Require a tag dispatch and a full expected commit SHA
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          ACTUAL_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          printf '%s\n' "$EXPECTED_SHA" | grep -Eq '^[0-9a-f]{40}$'
          [[ "$ACTUAL_REF" == refs/tags/v* ]] || exit 1

      - name: Check out the selected release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: refs/tags/${{ github.event.release.tag_name || github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Validate the selected tag and immutable public release text
        id: identity
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || github.ref_name }}
          ACTUAL_REF: ${{ github.ref }}
          EVENT_NAME: ${{ github.event_name }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          test "$ACTUAL_REF" = "refs/tags/$RELEASE_TAG"
          RESOLVED_SHA="$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")"
          printf '%s\n' "$RESOLVED_SHA" | grep -Eq '^[0-9a-f]{40}$'
          test "$(git rev-parse HEAD)" = "$RESOLVED_SHA"
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            test "$RESOLVED_SHA" = "$EXPECTED_SHA"
          fi
          python src/code_mower/release_identity.py --tag "$RELEASE_TAG"
          printf 'resolved-sha=%s\n' "$RESOLVED_SHA" >> "$GITHUB_OUTPUT"

  build-distributions:
    needs: release-identity
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pull-requests: read
    steps:
      - name: Check out the validated release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.release-identity.outputs.resolved-sha }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Install candidate verification dependencies
        run: python -m pip install 'PyYAML>=6.0' 'packaging>=23.2'

      - name: Retrieve and verify the qualified candidate without rebuilding
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id || vars.CODE_MOWER_CANDIDATE_RUN_ID }}
          SOURCE_SHA: ${{ needs.release-identity.outputs.resolved-sha }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN_ID" > "$RUNNER_TEMP/candidate-run.json"
          python - "$RUNNER_TEMP/candidate-run.json" <<'PY'
          import json, os, sys
          from pathlib import Path
          run = json.loads(Path(sys.argv[1]).read_text())
          assert run['path'] == '.github/workflows/release-candidate.yml'
          assert run['event'] == 'workflow_dispatch' and run['head_branch'] == 'main'
          assert run['status'] == 'completed' and run['conclusion'] == 'success'
          assert run['repository']['full_name'] == 'codemower-ai/code-mower'
          assert run['head_sha'] == os.environ['SOURCE_SHA']
          assert run['run_attempt'] == 1
          PY
          gh run download "$CANDIDATE_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name code-mower-candidate --dir candidate
          python scripts/release_candidate.py verify --dist candidate \
            --source-sha "$SOURCE_SHA" --require-candidate
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          from scripts.release_candidate import verify_rehearsal
          candidate = json.loads(Path('candidate/candidate.json').read_text())
          pr = json.loads(subprocess.check_output(['gh', 'pr', 'view', str(candidate['release_pr']),
              '--repo', os.environ['GITHUB_REPOSITORY'], '--json', 'state,mergeCommit']))
          assert pr['state'] == 'MERGED' and pr['mergeCommit']['oid'] == os.environ['SOURCE_SHA']
          verify_rehearsal(Path('candidate'), candidate)
          PY
          mkdir dist
          cp candidate/*.whl candidate/*.tar.gz dist/

      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: code-mower-dist
          path: dist/*
          if-no-files-found: error

  verify-distributions:
    needs: build-distributions
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: code-mower-dist
          path: dist

      - name: Verify distributions
        run: |
          python -m pip install --upgrade pip
          python -m pip install twine
          python -m twine check dist/*

  publish-testpypi:
    needs: [release-identity, verify-distributions]
    runs-on: ubuntu-latest
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.publish_testpypi == true) || (github.event_name == 'release' && vars.CODE_MOWER_TESTPYPI_PUBLISH == 'true') }}
    permissions:
      contents: read
      id-token: write
    environment: testpypi
    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: code-mower-dist
          path: dist

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    needs: [release-identity, verify-distributions]
    runs-on: ubuntu-latest
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.publish_pypi == true) || (github.event_name == 'release' && vars.CODE_MOWER_PYPI_PUBLISH == 'true') }}
    permissions:
      contents: read
      id-token: write
    environment: pypi
    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: code-mower-dist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
