# Code Mower workflow template: run Mac builder lanes non-interactively.
name: Mac lane runner

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      lane:
        description: "Lane to run (codex, claude or all)"
        required: false
        default: "all"
      target:
        description: "Force a target: issue:<n> or pr:<n>"
        required: false
        default: ""
      audit_target:
        description: "Force a Claude audit target: pr:<n>"
        required: false
        default: ""
      max_minutes:
        description: "Wall-clock cap for the CLI run"
        required: false
        default: "90"
      enable_audit_duty:
        description: "Allow an explicit Claude audit fallback on manual runs"
        required: false
        default: "false"

permissions:
  contents: read

jobs:
  run:
    if: ${{ vars.LANE_MAC_RUNNER_ENABLED == 'true' }}
    runs-on: ["self-hosted", "macOS", "code-mower-lane"]
    timeout-minutes: 105
    strategy:
      fail-fast: false
      matrix:
        lane: ["codex", "claude"]
    concurrency:
      group: lane-mac-runner-${{ matrix.lane }}
      cancel-in-progress: false
    env:
      LANE: ${{ matrix.lane }}
      REPO: ${{ github.repository }}
      TARGET: ${{ github.event.inputs.target || '' }}
      AUDIT_TARGET: ${{ github.event.inputs.audit_target || '' }}
      MAX_MINUTES: ${{ github.event.inputs.max_minutes || '90' }}
      LANE_FILTER: ${{ github.event.inputs.lane || 'all' }}
      ENABLE_AUDIT_DUTY: ${{ github.event.inputs.enable_audit_duty || 'false' }}
    steps:
      - name: Skip lanes not selected
        id: selection
        run: |
          set -euo pipefail
          if [ "${LANE_FILTER}" != "all" ] && [ "${LANE_FILTER}" != "${LANE}" ]; then
            echo "skip=true" >> "${GITHUB_OUTPUT}"
            echo "lane ${LANE} not selected"
            exit 0
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${AUDIT_TARGET}" ] && [ "${LANE}" != "claude" ]; then
            echo "skip=true" >> "${GITHUB_OUTPUT}"
            echo "audit target runs only use the claude lane"
            exit 0
          fi
          python3 - <<'PY'
          import os
          import sys

          raw = os.environ.get("MAX_MINUTES", "")
          configured = int("90")
          if not raw.isdecimal() or int(raw) <= 0:
              print("::error::max_minutes must be a positive integer", file=sys.stderr)
              raise SystemExit(1)
          requested = int(raw)
          if requested > configured:
              print(
                  f"::error::max_minutes {requested} exceeds configured maximum "
                  f"{configured}; raise owner_surface.lane_runner_max_minutes "
                  "to allow longer runs",
                  file=sys.stderr,
              )
              raise SystemExit(1)
          PY
          echo "skip=false" >> "${GITHUB_OUTPUT}"

      - name: Checkout lane tools
        if: steps.selection.outputs.skip != 'true'
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Run one unit of lane work
        if: steps.selection.outputs.skip != 'true'
        run: |
          set -euo pipefail
          for name in USER LOGNAME SHELL LANG; do
            [ -n "${!name:-}" ] || { echo "runner env is missing ${name}" >&2; exit 1; }
          done
          unset GH_TOKEN GITHUB_TOKEN || true
          gh auth status >/dev/null 2>&1 || {
            echo "gh is not logged in for the runner user" >&2
            exit 1
          }
          args=(--lane "${LANE}" --repo "${REPO}" --max-minutes "${MAX_MINUTES}")
          if [ -n "${TARGET}" ]; then
            args+=(--target "${TARGET}")
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${AUDIT_TARGET}" ] && [ "${LANE}" = "claude" ]; then
            args+=(--audit-target "${AUDIT_TARGET}")
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${ENABLE_AUDIT_DUTY}" = "true" ]; then
            args+=(--enable-audit-duty)
          fi
          exec tools/lanes/run_mac_lane.sh "${args[@]}"
