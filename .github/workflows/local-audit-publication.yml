# Metadata only. repository_dispatch always executes the default-branch workflow.
# Never check out a PR, interpolate payloads in shell, or upload local artifacts.
name: Code Mower Local Audit Publication
on:
  repository_dispatch:
    types: [code-mower-local-audit]
permissions:
  contents: read
  actions: read
  pull-requests: write
  issues: write
concurrency:
  group: code-mower-local-audit-publication
  cancel-in-progress: false
jobs:
  publish:
    outputs:
      pr_number: ${{ steps.publish.outputs.pr_number }}
      comment_id: ${{ steps.publish.outputs.comment_id }}
      digest: ${{ steps.publish.outputs.digest }}
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out immutable trusted default-branch code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify and publish audit metadata
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/audit_publication.py publish
  # Only verifier-produced numeric ids and a validated hex digest enter this
  # immutable receipt. Consumers bind the comment id to this job via the API.
  receipt:
    needs: publish
    name: "Local audit pr=${{ needs.publish.outputs.pr_number }} comment=${{ needs.publish.outputs.comment_id }} digest=${{ needs.publish.outputs.digest }}"
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - run: 'true'
  # repository_dispatch resets GitHub's three-level workflow_run chain while
  # carrying no audit assertion. Consumers fetch and verify this run, receipt,
  # published comment and current PR/head before applying a label.
  reconcile:
    needs: receipt
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Notify verified audit labelers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          for attempt in 1 2 3; do
            if gh api -X POST "repos/${GITHUB_REPOSITORY}/dispatches" \
              -f event_type=code-mower-local-audit-published \
              -F "client_payload[publication_run_id]=${GITHUB_RUN_ID}"; then
              exit 0
            fi
            sleep "$((attempt * 2))"
          done
          echo "::warning::Audit publication is valid, but labeler notification failed; redispatch this immutable publication run id."
          exit 0
