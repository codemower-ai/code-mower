# Code Mower workflow template: label agent-authored PRs and re-arm audits.
name: Code Mower agent PR labeler

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  pull-requests: write
  issues: write

concurrency:
  group: code-mower-agent-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  CODE_MOWER_AGENT_PR_RULES_JSON: "[{\"branch_prefixes\":[\"cursor/\"],\"builder_label\":\"builder:grok-bot\",\"builder_lane\":\"grok-bot\"}]"
  CODE_MOWER_AGENT_PR_AUDIT_LANES_JSON: "[{\"author_lane\":\"codex\",\"blocked\":\"codex-audit-blocked\",\"done\":\"codex-audit-done\",\"id\":\"codex\",\"needs\":\"needs-codex-audit\"},{\"author_lane\":\"claude\",\"blocked\":\"claude-audit-blocked\",\"done\":\"claude-audit-done\",\"id\":\"claude_audit\",\"needs\":\"needs-claude-audit\"}]"
  CODE_MOWER_DISPATCH_TOKEN_ENV: "DISPATCH_TOKEN"

jobs:
  label:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.DISPATCH_TOKEN || '' }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_ACTION: ${{ github.event.action }}
    steps:
      - name: Plan agent labels
        id: plan
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          event = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text())
          pr = event["pull_request"]
          branch = pr.get("head", {}).get("ref", "")
          rules = json.loads(os.environ["CODE_MOWER_AGENT_PR_RULES_JSON"])
          audit_lanes = json.loads(os.environ["CODE_MOWER_AGENT_PR_AUDIT_LANES_JSON"])

          match = None
          for rule in rules:
              prefixes = rule.get("branch_prefixes") or []
              if any(branch.startswith(prefix) for prefix in prefixes):
                  match = rule
                  break

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              if not match:
                  print("matched=false", file=out)
                  raise SystemExit(0)
              print("matched=true", file=out)
              print(f"builder_lane={match['builder_lane']}", file=out)

          add_labels = [match["builder_label"]]
          add_labels.extend(lane["needs"] for lane in audit_lanes)
          remove_labels = [
              lane[key]
              for lane in audit_lanes
              for key in ("done", "blocked")
              if lane.get(key)
          ]
          Path(".code-mower-agent-add-labels.txt").write_text(
              "\n".join(dict.fromkeys(add_labels)) + "\n",
              encoding="utf-8",
          )
          Path(".code-mower-agent-remove-labels.txt").write_text(
              "\n".join(dict.fromkeys(remove_labels)) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Apply labels with human token
        if: steps.plan.outputs.matched == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::${CODE_MOWER_DISPATCH_TOKEN_ENV} secret is missing; labels must be applied by a human-owned token so audit workflows trigger"
            exit 1
          fi
          code_mower_error_is_rate_limited() {
            for file in "$@"; do
              if [ -s "${file}" ] && grep -qiE 'API rate limit exceeded|secondary rate limit|rate limit|HTTP (403|429)|status code:? (403|429)' "${file}"; then
                return 0
              fi
            done
            return 1
          }

          code_mower_backoff_rate_limit() {
            code_mower_error_is_rate_limited "$@" || return 1
            reset_epoch="$(gh api rate_limit --jq '.resources.core.reset // .rate.reset // ""' 2>/dev/null || true)"
            reset_iso=""
            if [[ "${reset_epoch}" =~ ^[0-9]+$ ]]; then
              now_epoch="$(date -u +%s)"
              wait_seconds=$((reset_epoch - now_epoch + 5))
              reset_iso="$(date -u -d "@${reset_epoch}" "+%Y-%m-%dT%H:%M:%SZ" 2>/dev/null || echo "${reset_epoch}")"
              if [ "${wait_seconds}" -le 0 ]; then
                wait_seconds=5
              fi
              if [ "${wait_seconds}" -gt 240 ]; then
                echo "::error::GitHub API rate limit hit; reset at ${reset_iso}; operation did not complete."
                return 2
              fi
            else
              wait_seconds=30
            fi
            if [ -n "${reset_iso}" ]; then
              echo "::notice::GitHub API rate limit hit; backing off until ${reset_iso} before retry."
            else
              echo "::notice::GitHub API rate limit hit; backing off for ${wait_seconds} seconds before retry."
            fi
            sleep "${wait_seconds}"
            return 0
          }

          code_mower_pr_view_labels_retry() {
            output_file="$1"
            attempt=1
            max_attempts=3
            while true; do
              label_error="$(mktemp)"
              if gh pr view "${PR_NUMBER}" --repo "${GITHUB_REPOSITORY}" --json labels --jq '.labels[].name' >"${output_file}" 2>"${label_error}"; then
                rm -f "${label_error}"
                return 0
              fi
              if [ "${attempt}" -lt "${max_attempts}" ] && code_mower_backoff_rate_limit "${label_error}"; then
                attempt=$((attempt + 1))
                rm -f "${label_error}"
                echo "::notice::Retrying PR label lookup after rate-limit backoff (attempt ${attempt}/${max_attempts})."
                continue
              fi
              echo "::error::Failed to look up current PR labels."
              cat "${label_error}" >&2
              rm -f "${label_error}"
              return 1
            done
          }

          code_mower_pr_edit_retry() {
            description="$1"
            shift
            attempt=1
            max_attempts=3
            while true; do
              label_error="$(mktemp)"
              if gh pr edit "${PR_NUMBER}" --repo "${GITHUB_REPOSITORY}" "$@" 2>"${label_error}"; then
                rm -f "${label_error}"
                return 0
              fi
              if [ "${attempt}" -lt "${max_attempts}" ] && code_mower_backoff_rate_limit "${label_error}"; then
                attempt=$((attempt + 1))
                rm -f "${label_error}"
                echo "::notice::Retrying ${description} after rate-limit backoff (attempt ${attempt}/${max_attempts})."
                continue
              fi
              echo "::error::Failed to ${description}."
              cat "${label_error}" >&2
              rm -f "${label_error}"
              return 1
            done
          }

          mapfile -t remove_labels < .code-mower-agent-remove-labels.txt
          mapfile -t add_labels < .code-mower-agent-add-labels.txt
          current_labels_file="$(mktemp)"
          trap 'rm -f "${current_labels_file:-}"' EXIT
          code_mower_pr_view_labels_retry "${current_labels_file}"
          for label in "${remove_labels[@]}"; do
            [ -n "${label}" ] || continue
            if grep -Fxq -- "${label}" "${current_labels_file}"; then
              code_mower_pr_edit_retry "remove label ${label}" --remove-label "${label}"
            else
              echo "::notice::Label ${label} is already absent; nothing to remove."
            fi
          done
          add_args=()
          for label in "${add_labels[@]}"; do
            [ -n "${label}" ] && add_args+=(--add-label "${label}")
          done
          if [ "${#add_args[@]}" -gt 0 ]; then
            code_mower_pr_edit_retry "add requested labels" "${add_args[@]}"
          fi
          printf '#%s (%s): %s\n' "${PR_NUMBER}" "${PR_ACTION}" "$(paste -sd ', ' .code-mower-agent-add-labels.txt)"
