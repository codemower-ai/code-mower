# Code Mower workflow template: apply labels from trusted audit-result comments.
name: Claude audit labeler

on:
  repository_dispatch:
    types: [code-mower-local-audit-published]
  issue_comment:
    types: [created, edited]

permissions:
  actions: write
  contents: read
  issues: write
  pull-requests: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  CODE_MOWER_DECISION_AUTHORITIES: ""
  CODE_MOWER_DECISION_AUTHORITIES_OVERRIDE: ${{ vars.CODE_MOWER_DECISION_AUTHORITIES || '' }}
  CODE_MOWER_AUTHOR_EXCLUSION_JSON: "{\"authors\":{\"chatgpt-codex-connector[bot]\":\"codex\",\"claude[bot]\":\"claude\",\"cursor[bot]\":\"cursor\",\"devin-ai-integration\":\"devin\",\"devin-ai-integration[bot]\":\"devin\",\"grok-bot[bot]\":\"cursor\"},\"branch_prefixes\":{\"cursor/\":\"cursor\",\"devin/\":\"devin\"},\"enabled\":true,\"labels\":{\"builder:claude\":\"claude\",\"builder:codex\":\"codex\",\"builder:cursor\":\"cursor\",\"builder:devin\":\"devin\",\"builder:gitar\":\"gitar\",\"builder:grok-bot\":\"cursor\",\"builder:muse\":\"muse\"},\"require_verified_lineage\":true}"

jobs:
  label:
    if: >-
      (github.event_name == 'repository_dispatch' && github.event.action == 'code-mower-local-audit-published') ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        (
          (
            contains(',claude-audit-bot,claude-audit-bot[bot],github-actions[bot],', format(',{0},', github.event.comment.user.login)) &&
            (
              contains(github.event.comment.body, 'CLAUDE_AUDIT_STATE') ||
              contains(github.event.comment.body, 'Claude Audit') ||
              contains(github.event.comment.body, 'HEAD_CHANGED_DURING_REVIEW') ||
              contains(github.event.comment.body, 'Label state:') ||
              contains(github.event.comment.body, 'Intended label state:') ||
              contains(github.event.comment.body, 'Expected labels:') ||
              contains(github.event.comment.body, 'Intended labels:') ||
              contains(github.event.comment.body, 'needs-claude-audit') ||
              contains(github.event.comment.body, 'claude-audit-done') ||
              contains(github.event.comment.body, 'claude-audit-blocked')
            )
          ) ||
          (
            contains(format(',{0},', vars.CLAUDE_AUDIT_BOT_AUTHORS), format(',{0},', github.event.comment.user.login)) &&
            contains(github.event.comment.body, 'CLAUDE_AUDIT_STATE')
          )
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out Code Mower support files from default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Resolve verified publication comment
        id: publication
        if: github.event_name == 'repository_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          TRAILER_LANE: claude
        run: python3 tools/audit_publication.py prepare-label-event

      - name: Apply Claude audit labels
        if: github.event_name != 'repository_dispatch' || steps.publication.outputs.ready == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
          CLAUDE_AUDIT_BOT_AUTHORS: ${{ vars.CLAUDE_AUDIT_BOT_AUTHORS }}
          PYTHONPATH: src
          PUBLICATION_EVENT_PATH: ${{ steps.publication.outputs.event_path }}
          TRAILER_LANE: claude
          CODE_MOWER_GITHUB_ACTIONS_WORKFLOWS: ".github/workflows/local-cli-audit.yml,.github/workflows/local-audit-publication.yml"
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "repository_dispatch" ]; then
            python3 -m tools.trailer_comment_labeler --lane "${TRAILER_LANE}" --event-path "${PUBLICATION_EVENT_PATH}"
          else
            scripts/dev-python -m code_mower.cli trailer-comment-labeler --lane "${TRAILER_LANE}"
          fi

      - name: Recompute Code Mower gate
        if: github.event_name != 'repository_dispatch' || steps.publication.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.publication.outputs.pr_number || github.event.issue.number }}
        run: |
          set -euo pipefail
          head_sha="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.head.sha')"
          gh workflow run code-mower-gate.yml \
            --repo "${GITHUB_REPOSITORY}" \
            --ref "${{ github.event.repository.default_branch }}" \
            -f "pr_number=${PR_NUMBER}" \
            -f "head_sha=${head_sha}"
